<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down Ping Pong</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: auto;
        }

        #game {
            width: 100vw;
            height: 100vh;
            min-width: 960px;
            min-height: 720px;
            background-color: #000;
            outline: 2px solid #fff;
            outline-offset: -2px;
        }

        canvas {
            display: block;
        }

        input {
            display: block;
            border: none;
            color: #fff;
            background: none;
        }
    </style>
</head>

<body>
    <div id="game"></div>
    <script src="node_modules/phaser/dist/phaser.min.js"></script>
    <script type="module" src="game.js"></script>
</body>

</html>
